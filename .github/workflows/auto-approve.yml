name: Approve eligible warehouse examples
on:
  workflow_run:
    workflows: [Validate lightweight OpenBIM]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: warehouse-approval-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  approve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      # This privileged job loads code exclusively from the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { approve } = require('./.github/scripts/approval.cjs');
            await approve({ github, context, core });
